name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: .python-version

      - run: uv sync --locked

      # Must stay `make check` so local and CI check the same set.
      - run: make check
